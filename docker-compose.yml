services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:///./data/notecast.db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      TTS_ENGINE: ${TTS_ENGINE:-edge}
      TTS_VOICE_FEMALE: ${TTS_VOICE_FEMALE:-en-US-AriaNeural}
      TTS_VOICE_MALE: ${TTS_VOICE_MALE:-en-US-GuyNeural}
      UPLOAD_DIR: ./data/uploads
      PODCAST_DIR: ./data/podcasts
      ENSURE_OLLAMA: "true"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - backend_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama:
  backend_data:
